<!-- chatbot/templates/chatbot.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Chatbot</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            /* Ultra-premium dark animated gradient background */
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .chat-box {
            /* Deep glassmorphism */
            background: rgba(15, 23, 42, 0.6);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.15), 0 1px 3px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        /* Subtle glowing top border line */
        .chat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8b5cf6, #ec4899, transparent);
            opacity: 0.8;
        }

        h2 {
            text-align: center;
            font-weight: 800;
            margin-bottom: 30px;
            /* Vibrant text gradient */
            background: linear-gradient(to right, #a855f7, #ec4899, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.8rem;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 20px rgba(236, 72, 153, 0.2);
        }

        textarea {
            width: 100%;
            height: 160px;
            resize: none;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 400;
            box-sizing: border-box;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            color: #f1f5f9;
        }

        textarea:focus {
            outline: none;
            border-color: #a855f7;
            background-color: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15), inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        textarea::placeholder {
            color: #64748b;
        }

        button.btn-primary {
            margin-top: 25px;
            padding: 16px 32px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            font-weight: 600;
            font-size: 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        /* Hover animation for button */
        button.btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(168, 85, 247, 0.5);
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
        }

        button.btn-primary:active {
            transform: translateY(1px);
        }

        .response {
            margin-top: 40px;
            background: rgba(30, 41, 59, 0.5);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
            position: relative;
        }

        /* Subtle glow block inside response */
        .response::before {
            content: '';
            position: absolute;
            top: 20px;
            left: -2px;
            width: 4px;
            height: calc(100% - 40px);
            background: #a855f7;
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px #a855f7;
        }

        .response ol {
            margin: 0;
            padding-left: 10px;
            font-size: 16px;
            line-height: 1.8;
            color: #e2e8f0;
            list-style-type: none;
        }

        .response li strong {
            color: #c084fc;
            font-weight: 700;
            font-size: 1.1em;
            display: block;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Mobile Format Changer */
        @media(max-width: 768px) {
            body {
                padding: 15px;
                min-height: auto;
                align-items: flex-start;
                margin-top: 20px;
            }

            .chat-box {
                padding: 25px;
                border-radius: 20px;
            }

            textarea {
                height: 140px;
                font-size: 15px;
                padding: 15px;
            }

            h2 {
                font-size: 2.2rem;
                margin-bottom: 25px;
            }

            .response {
                padding: 20px;
            }
        }
    </style>

</head>

<body>
    <div class="chat-box">
        <h2 style="text-align: center;">Ask AI</h2>
        <form method="post" id="chat-form">
            {% csrf_token %}
            <!-- Input from User -->
            <textarea name="user_input" placeholder="Ask to AI" spellcheck="true" id="input-box" class="form-control"
                rows="6" required>{{ request.POST.user_input }}</textarea>
            <br>
            <button type="submit" id="submit-btn" class="btn btn-primary mb-3">
                <span id="btn-text">Send</span>
                <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"
                    aria-hidden="true"></span>
            </button>
        </form>

        <!-- Output to User Input  -->
        {% if response %}
        <div class="response">
            <ol>
                <li><strong>AI:</strong> {{ response | linebreaks }}</li>
            </ol>

        </div>
        {% endif %}
    </div>

    <script>
        document.getElementById('chat-form').addEventListener('submit', function () {
            const btn = document.getElementById('submit-btn');
            const text = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');

            // Show loading state
            text.textContent = 'Generating... ';
            spinner.classList.remove('d-none');

            // Visually disable button to prevent multiple clicks
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.8';
        });
    </script>

</body>

</html>
